runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 40
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_CLOUD_LOCATION
    value: global
    availability:
      - RUNTIME
  - variable: GEMINI_MODEL
    value: gemini-2.5-flash
    availability:
      - RUNTIME
  - variable: EMBEDDING_MODEL
    value: gemini-embedding-001
    availability:
      - RUNTIME
  - variable: EMBEDDING_DIMENSION
    value: "1024"
    availability:
      - RUNTIME
